<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Asset Studio</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #16161a;
        color: #c9c9d1;
        font-family: "IBM Plex Sans KR", "Segoe UI", sans-serif;
      }
      .box {
        text-align: center;
      }
      .spinner {
        width: 36px;
        height: 36px;
        margin: 0 auto 16px;
        border: 3px solid #2e2e38;
        border-top-color: #8a8af0;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #status {
        font-size: 14px;
      }
      #error {
        display: none;
        max-width: 480px;
        color: #e0a0a0;
        font-size: 13px;
        line-height: 1.6;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner" id="spinner"></div>
      <p id="status">AI Asset Studio 백엔드를 시작하는 중…</p>
      <p id="error"></p>
    </div>
    <script>
      // The Rust side starts the backend, then navigates this window to the
      // gallery. If it fails, it calls showError() with what went wrong.
      function showError(message) {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("status").style.display = "none";
        const el = document.getElementById("error");
        el.style.display = "block";
        el.textContent = message;
      }
    </script>
  </body>
</html>
